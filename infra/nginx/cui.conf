# https://nginx.org/en/docs/beginners_guide.html Setting Up a Simple Proxy Server
# https://nginx.org/en/docs/http/ngx_http_core_module.html
server {
    listen 80;

    proxy_set_header Host $host;
    # use the real ip from client,
    # so that uvicorn can log the real client ip with flag --forwarded-allow-ips in its logs rather than log the nginx ip
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 1m;

    location / {
        root /data/www;
    }

    location /api/ {
        proxy_pass http://query-api:8001;
    }

    location /v1/logs {
        proxy_pass http://ingestion-api:8000;
    }
}
