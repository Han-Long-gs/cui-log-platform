[project]
name = "cui-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cui-db",
    "pydantic-settings>=2.15.0",
]

# This root pyproject.toml is not itself an installable package — it only
# exists to declare the uv workspace and hold shared dev tooling config.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cui-db = { workspace = true }


[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
# target-version intentionally omitted: ruff infers it from
# project.requires-python.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
