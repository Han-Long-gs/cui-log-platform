[project]
name = "cui-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cui-db",
    "cui-config",
]

# This root pyproject.toml is not itself an installable package — it only
# exists to declare the uv workspace and hold shared dev tooling config.
[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*",
]

[tool.uv.sources]
cui-db = { workspace = true }
cui-messaging = { workspace = true }
cui-schemas = { workspace = true }
cui-config = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx2>=2.13.1",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 120
exclude = ["migrations/versions"]
# target-version intentionally omitted: ruff infers it from
# project.requires-python.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# importlib mode lets test files in different folders share a basename (e.g. two test_schemas.py)
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["apps", "packages"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
