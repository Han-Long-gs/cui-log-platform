# ref: https://docs.docker.com/compose/gettingstarted/
#     https://docs.docker.com/reference/compose-file/services/#healthcheck
#     https://stackoverflow.com/questions/41330514/docker-rabbitmq-persistency # for rabbitmq data persistency...
services:
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    depends_on:
      ingestion-api:
        condition: service_started
      query-api:
        condition: service_started
    ports:
      - "127.0.0.1:80:80"

  ingestion-api:
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?set it in .env, see .env.example}:${POSTGRES_PASSWORD:?set it in .env, see .env.example}@postgres:5432/${POSTGRES_DB:?set it in .env, see .env.example}
      - BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER:?set it in .env, see .env.example}:${RABBITMQ_DEFAULT_PASS:?set it in .env, see .env.example}@rabbitmq:5672//
    build:
      context: .
      dockerfile: apps/ingestion-api/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      # temporary; queue mode doesnt need pg at startup (sync mode does)
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/readyz\")"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  query-api:
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?set it in .env, see .env.example}:${POSTGRES_PASSWORD:?set it in .env, see .env.example}@postgres:5432/${POSTGRES_DB:?set it in .env, see .env.example}
      # required by Settings(); query-api never connects to the broker
      - BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER:?set it in .env, see .env.example}:${RABBITMQ_DEFAULT_PASS:?set it in .env, see .env.example}@rabbitmq:5672//
    build:
      context: .
      dockerfile: apps/query-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/readyz\")"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  worker:
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?set it in .env, see .env.example}:${POSTGRES_PASSWORD:?set it in .env, see .env.example}@postgres:5432/${POSTGRES_DB:?set it in .env, see .env.example}
      - BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER:?set it in .env, see .env.example}:${RABBITMQ_DEFAULT_PASS:?set it in .env, see .env.example}@rabbitmq:5672//
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?set it in .env, see .env.example}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set it in .env, see .env.example}
      - POSTGRES_DB=${POSTGRES_DB:?set it in .env, see .env.example}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER:?set it in .env, see .env.example}", "-d", "${POSTGRES_DB:?set it in .env, see .env.example}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    volumes:
      - pg-data:/var/lib/postgresql

  rabbitmq:
    hostname: myrabbit
    image: rabbitmq:4.2.9-management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:?set it in .env, see .env.example}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?set it in .env, see .env.example}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    volumes:
      - mq-data:/var/lib/rabbitmq

  migrate:
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?set it in .env, see .env.example}:${POSTGRES_PASSWORD:?set it in .env, see .env.example}@postgres:5432/${POSTGRES_DB:?set it in .env, see .env.example}
      # required by Settings(); migrate never connects to the broker
      - BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER:?set it in .env, see .env.example}:${RABBITMQ_DEFAULT_PASS:?set it in .env, see .env.example}@rabbitmq:5672//
    build:
      context: .
      dockerfile: migrations/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
  mq-data:
