# https://docs.astral.sh/uv/guides/integration/github/
# https://docs.github.com/en/actions/tutorials/use-containerized-services/create-postgresql-service-containers
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install the project
        run: uv sync --locked --all-extras --dev --all-packages

      - name: Formatting
        run: uv run ruff format --check .

      - name: Linting
        run: uv run ruff check .
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

      rabbitmq:
        image: rabbitmq:4.2
        env:
          # the built-in guest user may only connect from inside the container (loopback);
          # port-mapped connections from the runner come from the Docker bridge, so define a real user
          RABBITMQ_DEFAULT_USER: cui
          RABBITMQ_DEFAULT_PASS: cui
        # wait until the AMQP listener is up, not just the container
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    # env for project
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
      BROKER_URL: amqp://cui:cui@127.0.0.1:5672//
      # same as .env.test; tests that need a specific mode build their own app (build_app fixture)
      INGEST_MODE: sync
      ALLOW_INGEST_SYNC: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install the project
        run: uv sync --locked --all-extras --dev --all-packages

      - name: Run tests
        run: uv run pytest --cov
